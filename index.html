<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Mental Dashboard</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="stylesheet" href="style.css?v=3">
</head>

<body>

<div class="app">

  <h1>🧠 Mental Dashboard</h1>

  <div class="tabs">
    <button id="logBtn">Log</button>
    <button id="historyBtn">History</button>
  </div>

  <section id="logPage">

    <section class="summary-card">

      <div class="summary-header">
  <h2>Today</h2>
</div>

<div class="stats-grid">
  <div>
    <div class="stat-label">Entries</div>
    <div id="entryCount">0</div>
  </div>

  <div>
    <div class="stat-label">Average</div>
    <div id="averageMood">—</div>
  </div>

  <div>
    <div class="stat-label">Last check-in</div>
    <div id="latestEntry">—</div>
  </div>
</div>

<div class="chart-header">
  <h3>Mood Trend</h3>
  <span>Last 10 entries</span>
</div>

<canvas id="moodChart" width="500" height="70"></canvas>
    </section>

    <div id="sliders"></div>

    <textarea
      id="notes"
      placeholder="Anything happen today?"
    ></textarea>

    <button id="saveBtn">
      Save Entry
    </button>

    <div id="saved">
      Saved ✓
    </div>

  </section>

  <section id="historyPage" class="hidden">

    <h2>History</h2>

    <div id="historyList">
      No entries yet.
    </div>

  </section>

</div>

<script src="utils.js"></script>
<script src="storage.js"></script>
<script src="history.js"></script>
<script src="dashboard.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>

</body>
</html>

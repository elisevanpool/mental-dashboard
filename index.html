<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Mental Dashboard</title>
<style>
:root{
  --bg:#111827;
  --card:#1f2937;
  --text:#ffffff;
  --muted:rgba(255,255,255,.68);
  --accent:#4f46e5;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  background:linear-gradient(180deg,#111827,#0b1220);
  color:var(--text);
}
.app{
  max-width:520px;
  margin:0 auto;
  padding:calc(20px + env(safe-area-inset-top)) 22px calc(26px + env(safe-area-inset-bottom));
}
h1{
  text-align:center;
  font-size:30px;
  margin:8px 0 18px;
}
.card{
  background:rgba(31,41,55,.92);
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  padding:18px;
  margin:14px 0;
  box-shadow:0 14px 40px rgba(0,0,0,.22);
}
.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  font-weight:800;
  font-size:21px;
}
.value{
  font-size:28px;
}
.label{
  color:var(--muted);
  margin-top:8px;
  min-height:22px;
}
input[type=range]{
  width:100%;
  margin:16px 0 2px;
  accent-color:white;
}
textarea{
  width:100%;
  min-height:96px;
  resize:vertical;
  border:0;
  border-radius:20px;
  padding:15px;
  margin-top:12px;
  background:rgba(17,24,39,.95);
  color:white;
  font-size:17px;
  outline:none;
}
button{
  width:100%;
  border:0;
  border-radius:20px;
  padding:17px 18px;
  margin-top:14px;
  color:white;
  background:var(--accent);
  font-size:21px;
  font-weight:800;
}
button.secondary{
  background:rgba(255,255,255,.10);
  font-size:17px;
}
button:active{transform:scale(.985)}
#saved{
  text-align:center;
  color:#a7f3d0;
  opacity:0;
  transition:.25s;
  font-weight:700;
  margin:12px 0 0;
}
.small{
  color:var(--muted);
  text-align:center;
  font-size:14px;
  margin-top:14px;
}
</style>
</head>
<body>
<main class="app">
  <h1>🧠 Mental Dashboard</h1>
  <div id="sliders"></div>
  <textarea id="notes" placeholder="Anything happen?"></textarea>
  <button id="saveBtn">Save</button>
  <button class="secondary" id="exportBtn">Export CSV</button>
  <div id="saved">Saved ✓</div>
  <div class="small"><span id="count">0</span> entries saved on this device</div>
</main>

<script>
const trackers = [
  {id:"mood", name:"Mood", emoji:"😊", value:50},
  {id:"energy", name:"Energy", emoji:"⚡", value:50},
  {id:"anxiety", name:"Anxiety", emoji:"😰", value:50},
  {id:"ocd", name:"OCD", emoji:"🧠", value:50},
  {id:"focus", name:"Focus", emoji:"🎯", value:50}
];

function moodLabel(v){
  if(v<=10) return ["Crisis","😭"];
  if(v<=20) return ["Panic","😰"];
  if(v<=35) return ["Distressed","😟"];
  if(v<=45) return ["Low","🙁"];
  if(v<=55) return ["Baseline","😐"];
  if(v<=70) return ["Calm","🙂"];
  if(v<=85) return ["Happy","😄"];
  return ["Amazing","🤩"];
}

function build(){
  const wrap = document.getElementById("sliders");
  wrap.innerHTML = trackers.map(t => `
    <section class="card">
      <div class="top">
        <div>${t.emoji} ${t.name}</div>
        <div class="value" id="${t.id}Value">${t.value}</div>
      </div>
      <input id="${t.id}" type="range" min="0" max="100" value="${t.value}">
      <div class="label" id="${t.id}Label"></div>
    </section>
  `).join("");

  trackers.forEach(t => {
    document.getElementById(t.id).addEventListener("input", () => update(t.id));
    update(t.id);
  });
}

function update(id){
  const v = Number(document.getElementById(id).value);
  document.getElementById(id+"Value").textContent = v;
  if(id === "mood"){
    const [label, emoji] = moodLabel(v);
    document.getElementById(id+"Label").textContent = `${emoji} ${label}`;
  } else {
    document.getElementById(id+"Label").textContent = `${v}/100`;
  }
}

function getEntries(){
  return JSON.parse(localStorage.getItem("mentalDashboardEntries") || "[]");
}

function setEntries(entries){
  localStorage.setItem("mentalDashboardEntries", JSON.stringify(entries));
  document.getElementById("count").textContent = entries.length;
}

function saveEntry(){
  const mood = Number(document.getElementById("mood").value);
  const [moodLabelText, moodEmoji] = moodLabel(mood);
  const entry = {
    timestamp: new Date().toISOString(),
    mood,
    moodLabel: moodLabelText,
    moodEmoji,
    energy: Number(document.getElementById("energy").value),
    anxiety: Number(document.getElementById("anxiety").value),
    ocd: Number(document.getElementById("ocd").value),
    focus: Number(document.getElementById("focus").value),
    notes: document.getElementById("notes").value
  };

  const entries = getEntries();
  entries.push(entry);
  setEntries(entries);

  document.getElementById("notes").value = "";
  document.getElementById("saved").style.opacity = 1;
  if(navigator.vibrate) navigator.vibrate(25);
  setTimeout(() => document.getElementById("saved").style.opacity = 0, 1400);
}

function exportCSV(){
  const entries = getEntries();
  const headers = ["Timestamp","Mood","Mood Label","Mood Emoji","Energy","Anxiety","OCD","Focus","Notes"];
  const rows = entries.map(e => [
    e.timestamp, e.mood, e.moodLabel, e.moodEmoji, e.energy, e.anxiety, e.ocd, e.focus, e.notes
  ]);
  const csv = [headers, ...rows].map(row =>
    row.map(cell => `"${String(cell ?? "").replaceAll('"','""')}"`).join(",")
  ).join("\n");

  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "mental-dashboard-entries.csv";
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById("saveBtn").addEventListener("click", saveEntry);
document.getElementById("exportBtn").addEventListener("click", exportCSV);

build();
setEntries(getEntries());

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js");
}
</script>
</body>
</html>

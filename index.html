<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mental Dashboard</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<h1>🧠 Mental Dashboard</h1>

<div class="tabs">
<button id="logBtn">Log</button>
<button id="historyBtn">History</button>
</div>

<section id="logPage">

<div id="sliders"></div>

<textarea
id="notes"
placeholder="Anything happen today?"
></textarea>

<button id="saveBtn">
Save Entry
</button>

<div id="saved">
Saved ✓
</div>

</section>

<section id="historyPage" class="hidden">

<h2>History</h2>

<div id="historyList">
No entries yet.
</div>

</section>

</div>

<script src="app.js"></script>

</body>
</html>

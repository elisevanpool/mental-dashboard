<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Mental Dashboard</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="stylesheet" href="style.css?v=20">
</head>

<body>

  <div class="app">

    <h1>🧠 Mental Dashboard</h1>

    <section id="todayPage">

      <div class="tabs">
        <button id="logBtn" type="button">Log</button>
        <button id="historyBtn" type="button">History</button>
      </div>

      <section id="logPage">

        <section class="summary-card">

          <div class="summary-header">
            <h2>Today</h2>
          </div>

          <div class="stats-grid">

            <div>
              <div class="stat-label">Entries</div>
              <div id="entryCount">0</div>
            </div>

            <div>
              <div class="stat-label">Average</div>
              <div id="averageMood">—</div>
            </div>

            <div>
              <div class="stat-label">Last check-in</div>
              <div id="latestEntry">—</div>
            </div>

          </div>

          <div class="chart-header">
            <h3>Mood Trend</h3>
            <span>Last 10 entries</span>
          </div>

          <canvas
            id="moodChart"
            width="500"
            height="70"
          ></canvas>

        </section>

        <div id="sliders"></div>

        <textarea
          id="notes"
          placeholder="Anything happen today?"
        ></textarea>

        <button id="saveBtn" type="button">
          Save Entry
        </button>

        <div id="saved">
          Saved ✓
        </div>

      </section>

      <section id="historyPage" class="hidden">

        <h2>History</h2>

        <div id="historyList">
          No entries yet.
        </div>

      </section>

    </section>

    <section id="masterlistPage" class="hidden">
      <h2>✅ Masterlist</h2>
      <p>Coming soon...</p>
    </section>

    <section id="journalPage" class="hidden">
      <h2>📖 Journal</h2>
      <p>Coming soon...</p>
    </section>

    <section id="calendarPage" class="hidden">
      <h2>📅 Calendar</h2>
      <p>Coming soon...</p>
    </section>

    <section id="morePage" class="hidden">
      <h2>☰ More</h2>
      <p>Coming soon...</p>
    </section>

    <section id="subpageContainer" class="hidden"></section>

    <nav class="bottom-nav">

      <button id="todayTab" type="button">
        ☀️<br>Today
      </button>

      <button id="masterlistTab" type="button">
        ✅<br>Masterlist
      </button>

      <button id="journalTab" type="button">
        📖<br>Journal
      </button>

      <button id="calendarTab" type="button">
        📅<br>Calendar
      </button>

      <button id="moreTab" type="button">
        ☰<br>More
      </button>

    </nav>

  </div>

  <script src="utils.js"></script>
  <script src="storage.js"></script>
  <script src="history.js"></script>
  <script src="dashboard.js"></script>
  <script src="ui.js"></script>

  <script src="today.js?v=2"></script>
  <script src="masterlist.js?v=2"></script>
  <script src="journal.js?v=3"></script>
  <script src="calendar.js?v=2"></script>

  <script src="tracker-logging.js?v=1"></script>
  <script src="subpages.js?v=2"></script>
  <script src="insights.js?v=1"></script>
  <script src="more.js?v=4"></script>

  <script src="app.js"></script>

</body>
</html>

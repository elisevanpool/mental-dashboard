<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#24104f"
  >

  <title>mybrain</title>

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="apple-touch-icon"
    href="apple-touch-icon.png"
  >

  <link
    rel="stylesheet"
    href="style.css?v=43"
  >
</head>

<body>

  <div class="app">

    <header class="brand" aria-label="mybrain">
      <span class="brand-mascot" aria-hidden="true">🧠</span>
      <span>mybrain</span>
    </header>

    <section id="todayPage">

      <section id="logPage">

        <section class="summary-card">

          <div class="summary-header">
            <h2>today</h2>
          </div>

          <div class="stats-grid">

            <div>
              <div class="stat-label">
                entries
              </div>

              <div id="entryCount">
                0
              </div>
            </div>

            <div>
              <div class="stat-label">
                average
              </div>

              <div id="averageMood">
                —
              </div>
            </div>

            <div>
              <div class="stat-label">
                last check-in
              </div>

              <div id="latestEntry">
                —
              </div>
            </div>

          </div>

          <div class="chart-header">

            <h3>mood trend</h3>

            <span>
              last 10 entries
            </span>

          </div>

          <canvas
            id="moodChart"
            width="500"
            height="70"
          ></canvas>

        </section>

        <div id="sliders"></div>

        <textarea
          id="notes"
          placeholder="anything happen today?"
        ></textarea>

        <button
          id="saveBtn"
          type="button"
        >
          save entry
        </button>

        <div id="saved">
          saved ✓
        </div>

      </section>

      <section id="historyPage" class="hidden" aria-hidden="true">
        <div id="historyList">no entries yet.</div>
      </section>

    </section>

    <section
      id="masterlistPage"
      class="hidden"
    >
      <h2>◇ masterlist</h2>
      <p>coming soon...</p>
    </section>

    <section
      id="journalPage"
      class="hidden"
    >
      <h2>▤ journal</h2>
      <p>coming soon...</p>
    </section>

    <section
      id="calendarPage"
      class="hidden"
    >
      <h2>▦ calendar</h2>
      <p>coming soon...</p>
    </section>

    <section
      id="subpageContainer"
      class="hidden"
    ></section>

    <nav class="bottom-nav" aria-label="primary navigation">
      <button id="todayTab" type="button" aria-label="today" title="today"><span aria-hidden="true">🧠</span></button>
      <button id="calendarTab" type="button" aria-label="calendar" title="calendar"><span aria-hidden="true">▦</span></button>
      <button id="masterlistTab" type="button" aria-label="masterlist" title="masterlist"><span class="nav-rhombus" aria-hidden="true"></span></button>
      <button id="journalTab" type="button" aria-label="journal" title="journal"><span aria-hidden="true">▤</span></button>
      <button id="createTab" class="create-control" type="button" aria-label="open create menu" title="create" aria-expanded="false" aria-controls="createMenu"><span aria-hidden="true">＋</span></button>
    </nav>

    <div id="createMenu" class="create-menu-backdrop hidden" role="presentation">
      <section class="create-menu" role="dialog" aria-modal="true" aria-labelledby="createMenuTitle">
        <div class="create-sky" aria-hidden="true"><i></i><i></i><i></i></div>
        <header><div><p>brainspace</p><h2 id="createMenuTitle">create something</h2></div><button id="closeCreateMenu" type="button" aria-label="close create menu" title="close">＋</button></header>
        <div class="create-menu-grid">
          <button type="button" data-create-action="task">◇ <span>add task</span></button>
          <button type="button" data-create-action="checklist">◇ <span>add checklist</span></button>
          <button type="button" data-create-action="journal">◇ <span>new journal item</span></button>
          <button type="button" data-create-action="checkin">◇ <span>log check-in</span></button>
          <button type="button" data-create-action="insights">◇ <span>insights</span></button>
          <button type="button" data-create-action="settings">◇ <span>settings</span></button>
          <button type="button" data-create-action="themes">◇ <span>themes</span></button>
        </div>
      </section>
    </div>

  </div>

  <!-- Core app files -->

  <script src="utils.js?v=43"></script>
  <script src="storage.js?v=43"></script>
  <script src="history.js?v=43"></script>
  <script src="dashboard.js?v=43"></script>
  <script src="ui.js?v=43"></script>

  <!-- Main pages -->

  <script src="masterlist.js?v=43"></script>
  <script src="today.js?v=43"></script>
  <script src="journal.js?v=43"></script>
  <script src="calendar.js?v=43"></script>

  <!-- Tracker systems -->

  <script src="tracker-logging.js?v=43"></script>
  <script src="sleep-tracking.js?v=43"></script>
  <script src="number-tracking.js?v=43"></script>
  <script src="note-tracking.js?v=43"></script>
  <script src="subpages.js?v=43"></script>

  <!-- More-page features -->

  <script src="insights.js?v=43"></script>
  <script src="achievements.js?v=43"></script>
  <script src="themes.js?v=43"></script>
  <script src="customization.js?v=43"></script>
  <script src="settings.js?v=43"></script>
  <script src="more.js?v=43"></script>

  <!-- Navigation startup -->

  <script src="app.js?v=43"></script>

</body>
</html>
